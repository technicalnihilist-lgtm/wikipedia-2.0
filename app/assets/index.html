<!DOCTYPE html>
<html lang="en" data-anim="on" data-glass="on" data-depth="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia 2.0 — live</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wikipedia 2.0">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --bg-2:#efeade; --surface:#fffdf8; --surface-2:#faf7f0;
  --ink:#1b1915; --ink-2:#4a4438; --dim:#7d7466;
  --line:rgba(27,25,21,.13); --line-soft:rgba(27,25,21,.07);
  --rust:#a8401c; --rust-dim:#f2e2d9; --sage:#55663f; --sage-dim:#e6ebdc;
  --gold:#9a7526; --gold-dim:#f4ecd8;
  --shadow:0 1px 2px rgba(27,25,21,.05), 0 8px 24px -12px rgba(27,25,21,.18);
  --shadow-lg:0 2px 4px rgba(27,25,21,.06), 0 24px 48px -24px rgba(27,25,21,.30);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15140f;--bg-2:#1b1a14;--surface:#1e1c16;--surface-2:#232019;--ink:#f3efe4;--ink-2:#cdc5b4;--dim:#9a9181;--line:rgba(243,239,228,.15);--line-soft:rgba(243,239,228,.08);--rust:#e2825a;--rust-dim:#3a2318;--sage:#a3b784;--sage-dim:#242c1c;--gold:#d8b568;--gold-dim:#332b16;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -24px rgba(0,0,0,.7)}
}
html[data-theme="light"]{--bg:#f6f3ec;--bg-2:#efeade;--surface:#fffdf8;--surface-2:#faf7f0;--ink:#1b1915;--ink-2:#4a4438;--dim:#7d7466;--line:rgba(27,25,21,.13);--line-soft:rgba(27,25,21,.07);--rust:#a8401c;--rust-dim:#f2e2d9;--sage:#55663f;--sage-dim:#e6ebdc;--gold:#9a7526;--gold-dim:#f4ecd8;--shadow:0 1px 2px rgba(27,25,21,.05),0 8px 24px -12px rgba(27,25,21,.18);--shadow-lg:0 2px 4px rgba(27,25,21,.06),0 24px 48px -24px rgba(27,25,21,.30)}
html[data-theme="dark"]{--bg:#15140f;--bg-2:#1b1a14;--surface:#1e1c16;--surface-2:#232019;--ink:#f3efe4;--ink-2:#cdc5b4;--dim:#9a9181;--line:rgba(243,239,228,.15);--line-soft:rgba(243,239,228,.08);--rust:#e2825a;--rust-dim:#3a2318;--sage:#a3b784;--sage-dim:#242c1c;--gold:#d8b568;--gold-dim:#332b16;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -24px rgba(0,0,0,.7)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -10%,rgba(168,64,28,.07),transparent 42%),
                   radial-gradient(circle at 88% 0%,rgba(85,102,63,.07),transparent 38%);
  background-attachment:fixed}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
::selection{background:var(--rust-dim);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dot-i{width:6px;height:6px;border-radius:50%;background:var(--rust);flex-shrink:0;display:inline-block}

header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line-soft)}
.top-in{display:flex;align-items:center;gap:16px;height:74px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;
  font-family:var(--serif);font-size:23px;line-height:1;padding-bottom:3px;flex-shrink:0}
.brand b{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.brand b span{color:var(--rust);font-style:italic}
.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:-3px}
.search{flex:1;position:relative;max-width:760px;margin:0 6px}
.search input{width:100%;height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface);
  padding:0 18px 0 46px;font-size:15.5px;font-family:var(--sans);color:var(--ink);outline:none;
  transition:border-color .18s,box-shadow .18s;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--rust);box-shadow:0 0 0 4px var(--rust-dim)}
.search svg{position:absolute;left:16px;top:17px;opacity:.55}
.kbd{position:absolute;right:12px;top:14px;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:3px 6px;background:var(--surface-2)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;
  background:var(--surface);transition:.16s;font-size:15px}
.icon-btn:hover{background:var(--surface-2);border-color:var(--dim);transform:translateY(-1px)}
.lang-pill{height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 13px;
  display:flex;align-items:center;gap:7px;font-size:12.5px;transition:.16s;max-width:148px;color:var(--ink-2)}
.lang-pill:hover{background:var(--surface-2);border-color:var(--rust);color:var(--rust)}
.lang-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--sage);flex-shrink:0}
.lang-pill span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.icon-btn.dots{font-size:20px;line-height:0;padding-bottom:9px;letter-spacing:0}
.moremenu{min-width:250px}
.moremenu{max-height:calc(100vh - 96px);overflow:auto}
.menu{position:absolute;top:52px;right:0;min-width:330px;max-width:min(92vw,400px);background:var(--surface);border:1px solid var(--line);
  border-radius:13px;box-shadow:var(--shadow-lg);padding:7px;display:none;z-index:80;max-height:74vh;overflow:auto}
.menu.open{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
.menu .mi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;border-radius:8px;
  font-size:14px;cursor:pointer;transition:background .12s}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi.on{background:var(--rust-dim);color:var(--rust);font-weight:500}
.menu .mi small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.menu .mh{padding:8px 11px 5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.menu input{width:calc(100% - 14px);margin:0 7px 7px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);padding:0 10px;font-size:13.5px;color:var(--ink);outline:none;font-family:var(--sans)}
.menu input:focus{border-color:var(--rust)}
.menu .mf{padding:9px 11px;border-top:1px solid var(--line-soft);margin-top:5px;font-size:11.5px;color:var(--dim);line-height:1.45}

.hero{padding:66px 0 40px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,82px);line-height:.98;
  letter-spacing:-.025em;margin:0 0 20px;max-width:16ch}
.hero h1 em{font-style:italic;color:var(--rust)}
.hero p.lede{font-size:18.5px;line-height:1.62;color:var(--ink-2);max-width:64ch;margin:0 0 28px}
.hero p.lede b{font-weight:600;color:var(--ink)}
.btn{height:44px;padding:0 20px;border-radius:11px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;
  gap:9px;transition:.16s;border:1px solid transparent}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2);transform:translateY(-2px)}

.sect-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:56px 0 20px;
  padding-bottom:13px;border-bottom:1px solid var(--line)}
.sect-head h2{font-family:var(--serif);font-weight:400;font-size:31px;letter-spacing:-.015em;margin:0;display:flex;align-items:center;gap:10px}

.tfa{display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:transform .22s,box-shadow .22s}
.tfa:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tfa .fx{padding:38px 40px;display:flex;flex-direction:column;justify-content:center}
.tfa h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1.03;letter-spacing:-.02em;margin:10px 0 14px}
.tfa p{color:var(--ink-2);font-size:16px;margin:0 0 20px;max-width:46ch;display:-webkit-box;-webkit-line-clamp:5;
  -webkit-box-orient:vertical;overflow:hidden}
.tfa .fig{position:relative;min-height:330px;max-height:430px;background:var(--bg-2);overflow:hidden}
.tfa .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tfa:hover .fig img{transform:scale(1.035)}
.kicker{display:flex;align-items:center;gap:9px}
.kicker span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust)}

.potd{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.potd .fig{position:relative;background:var(--bg-2);min-height:300px;max-height:420px;overflow:hidden;cursor:pointer}
.potd .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.potd .fig:hover img{transform:scale(1.03)}
.potd .px{padding:30px 32px;display:flex;flex-direction:column;justify-content:center}
.potd h3{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin:8px 0 12px}
.potd p{font-size:14.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.6}
.credit-chip{position:absolute;bottom:12px;left:12px;right:auto;max-width:calc(100% - 24px);display:flex;align-items:center;gap:8px;
  background:rgba(12,11,9,.64);backdrop-filter:blur(8px);color:#f4f0e6;border-radius:9px;padding:7px 11px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.credit-chip b{font-weight:500;color:#fff}

.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;margin-top:26px;align-items:start}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:22px 24px}
.panel h4{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
.rank{display:flex;gap:13px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.rank:last-child{border-bottom:none}
.rank .n{font-family:var(--mono);font-size:11px;color:var(--dim);width:20px;flex-shrink:0;padding-top:3px}
.rank .t{font-size:14.5px;font-weight:500;line-height:1.35}
.rank .d{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.rank .v{font-family:var(--mono);font-size:10px;color:var(--sage);white-space:nowrap;padding-top:3px}
.rank img{width:46px;height:46px;object-fit:cover;border-radius:7px;flex-shrink:0;border:1px solid var(--line)}
.rank:hover .t{color:var(--rust)}
.otd{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.otd:last-child{border-bottom:none}
.otd .y{font-family:var(--serif);font-size:19px;color:var(--rust);width:52px;flex-shrink:0;line-height:1.2}
.otd .x{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.otd:hover .x{color:var(--ink)}
.dyk{font-size:14px;line-height:1.6;color:var(--ink-2);padding:9px 0;border-bottom:1px solid var(--line-soft)}
.dyk:last-child{border-bottom:none}
.dyk b{color:var(--ink);font-weight:600}
.dyk a{color:var(--rust);cursor:pointer}

.crumbs{display:flex;align-items:center;gap:9px;padding:24px 0 0;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex-wrap:wrap}
.crumbs a:hover{color:var(--rust)}
.art-head{padding:18px 0 0}
.art-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5.4vw,64px);line-height:1.02;
  letter-spacing:-.025em;margin:0 0 12px;max-width:22ch;overflow-wrap:anywhere}
.art-head .desc{font-size:17.5px;color:var(--ink-2);margin:0 0 18px;max-width:64ch;line-height:1.55}
.art-meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.pill{height:31px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.pill.mono-pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.pill.acc{background:var(--sage-dim);border-color:transparent;color:var(--sage)}
a.pill:hover{border-color:var(--dim);color:var(--ink)}

.art-grid{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:48px;align-items:start;padding-bottom:20px}
.art-grid>*{min-width:0}
.rail,.rail-box{min-width:0}
.rail{position:sticky;top:88px;display:flex;flex-direction:column;gap:20px}
.rail-box{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px 16px}
.rail-box .rh{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rail-box ol{margin:0;padding:0;list-style:none;counter-reset:toc;max-height:52vh;overflow:auto}
.rail-box ol li{counter-increment:toc;margin-bottom:1px}
.rail-box ol li a{display:block;padding:5px 0 5px 22px;font-size:12.5px;color:var(--ink-2);position:relative;line-height:1.4;border-radius:6px}
.rail-box ol li a::before{content:counter(toc,decimal-leading-zero);position:absolute;left:0;top:6px;font-family:var(--mono);font-size:9px;color:var(--dim)}
.rail-box ol li a:hover,.rail-box ol li a.on{color:var(--rust)}
.rail-box ol li.sub a{padding-left:34px;font-size:12px;color:var(--dim)}
.rail-box ol li.sub a::before{left:20px;content:'·'}
.lang-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;margin-top:8px;
  scrollbar-width:thin}
.lang-list button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px;
  border-radius:7px;border:1px solid transparent;background:transparent;font-size:13px;text-align:left;
  max-width:100%;transition:background .12s,border-color .12s;line-height:1.3}
.lang-list button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lang-list button small{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.08em;flex-shrink:0}
.lang-list button:hover{background:var(--surface-2);border-color:var(--line)}
.lang-list button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang-list button.on small{color:var(--bg);opacity:.65}
.lang-filter{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
  padding:0 10px;font-size:12.5px;color:var(--ink);outline:none;font-family:var(--sans);margin-top:9px}
.lang-filter:focus{border-color:var(--rust)}

.prose{max-width:74ch;min-width:0}
.prose p{margin:0 0 17px;font-size:16.5px;line-height:1.72;color:var(--ink-2)}
.prose a{color:var(--ink);cursor:pointer;text-decoration:underline;
  text-decoration-color:color-mix(in srgb,var(--rust) 45%,transparent);
  text-decoration-thickness:1px;text-underline-offset:2px;transition:color .12s,text-decoration-color .12s}
.prose a:hover{color:var(--rust);text-decoration-color:var(--rust)}
.prose h2,.prose .mw-heading2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.015em;margin:40px 0 14px;
  padding-top:16px;border-top:1px solid var(--line-soft);scroll-margin-top:88px}
.prose h3,.prose .mw-heading3{font-family:var(--sans);font-weight:600;font-size:16px;margin:24px 0 10px;color:var(--ink);scroll-margin-top:88px}
.prose h4{font-size:14px;font-weight:600;margin:18px 0 8px;color:var(--ink)}
.prose ul,.prose ol{margin:0 0 18px;padding-left:22px}
.prose li{margin-bottom:7px;font-size:15.5px;line-height:1.62;color:var(--ink-2)}
.prose b,.prose strong{color:var(--ink)}
.prose blockquote{margin:0 0 18px;padding:12px 18px;border-left:2px solid var(--rust);background:var(--surface-2);
  border-radius:0 8px 8px 0;font-size:15.5px;color:var(--ink-2)}
.prose sup{font-size:10px;color:var(--dim)}
.wp-fig{margin:22px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.wp-fig.lead-fig img{max-height:470px;object-fit:cover;object-position:center 30%}
.wp-fig img{width:100%;display:block;height:auto}
.wp-fig figcaption{padding:9px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);line-height:1.7;border-top:1px solid var(--line-soft);background:var(--surface-2)}
.wp-fig figcaption b{color:var(--ink-2);font-weight:500}
.wp-fig figcaption a{color:var(--rust)}
.prose .table-wrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:10px}
.prose .table-wrap table{min-width:100%}
.prose table{border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.prose table th,.prose table td{padding:8px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.prose table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:400}
.prose .infobox{float:right;width:290px;min-width:0;max-width:290px;margin:0 0 18px 22px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);font-size:12.5px;overflow:hidden}
.prose .infobox img{width:100%;height:auto}
.wp-fig .cr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:4px;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);line-height:1.6}
.wp-fig .cr .cr-txt{min-width:0;flex:1}
.lnk{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--rust);padding:0;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none}
.lnk:hover{color:var(--ink)}
.dl-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;flex-shrink:0;transition:.15s}
.dl-btn:hover{border-color:var(--rust);color:var(--rust);background:var(--rust-dim)}
.dl-btn:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);

  stroke-linejoin:round;transition:transform .18s}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}

/* ================= FX: liquid glass · 4D depth · bounce ================= */
:root{--g-blur:22px;--g-a:.55;--g-shine:.6;--dur:1;--ease:cubic-bezier(.34,1.63,.64,1);--glass-rgb:255 255 255}
@media(prefers-color-scheme:dark){:root{--glass-rgb:38 36 30}}
html[data-theme="light"]{--glass-rgb:255 255 255}
html[data-theme="dark"]{--glass-rgb:38 36 30}
.glass-bg{display:none;position:fixed;left:0;right:0;top:-20vh;bottom:-20vh;overflow:hidden;z-index:-1;pointer-events:none;
  transform:translate3d(calc(var(--gx,0)*-2px),calc(var(--sy,0)*-.12px),0)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.62;animation:drift 22s ease-in-out infinite alternate}
.o1{width:48vmax;height:48vmax;left:-12vmax;top:0;background:#ff8a5c}
.o2{width:44vmax;height:44vmax;right:-14vmax;top:22vh;background:#6f8cff;animation-duration:28s}
.o3{width:42vmax;height:42vmax;left:18vw;bottom:-6vmax;background:#4fd1a5;animation-duration:25s}
.o4{width:30vmax;height:30vmax;right:8vw;bottom:2vmax;background:#f6c85f;animation-duration:19s}
@keyframes drift{to{transform:translate3d(7vw,6vh,0) scale(1.18)}}
html[data-glass="on"] .glass-bg{display:block}
html[data-glass="on"]{--surface:rgb(var(--glass-rgb)/var(--g-a));--surface-2:rgb(var(--glass-rgb)/calc(var(--g-a)*.6))}
html[data-glass="on"] :is(.panel,.tfa,.potd,.rail-box,.res-card,.cat-tile,.menu,.ovl-card,.pill,.icon-btn,.lang-pill,.btn-ghost,.search input,.wp-fig,.infobox,.topstats,.errbox,.more-btn,.cat-more,.ovl-head){
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.7);backdrop-filter:blur(var(--g-blur)) saturate(1.7);
  background-image:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgb(255 255 255/calc(var(--gl,0)*var(--g-shine)*.45)),transparent 55%),
    linear-gradient(135deg,rgb(255 255 255/calc(var(--g-shine)*.4)),rgb(255 255 255/0) 40%,rgb(255 255 255/calc(var(--g-shine)*.12)));
  box-shadow:inset 0 1px 0 rgb(255 255 255/calc(var(--g-shine)*.9)),inset 0 0 0 1px rgb(255 255 255/calc(var(--g-shine)*.22)),
    inset 0 -14px 26px -16px rgb(255 255 255/calc(var(--g-shine)*.35)),calc(var(--sx,0)*1px) calc(16px + var(--sy,0)*1px) 38px -18px rgb(0 0 0/.38)}
html[data-glass="on"] header.top{background:rgb(var(--glass-rgb)/calc(var(--g-a)*.75));-webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.8);
  backdrop-filter:blur(var(--g-blur)) saturate(1.8);box-shadow:inset 0 -1px 0 rgb(255 255 255/calc(var(--g-shine)*.4))}
html[data-glass="on"] .ovl{background:rgb(10 9 7/.38);-webkit-backdrop-filter:blur(calc(var(--g-blur)*.5));backdrop-filter:blur(calc(var(--g-blur)*.5))}
html[data-glass="on"] .ovl-head{box-shadow:none}

/* 4D depth */
html[data-depth="on"] :is(.tfa,.potd,.res-card,.cat-tile,.panel,.topstats){will-change:transform}
html[data-gyro="on"][data-depth="on"] :is(.tfa,.potd,.res-card,.cat-tile,.panel,.topstats){transform:perspective(900px) rotateX(calc(var(--gy,0)*1deg)) rotateY(calc(var(--gx,0)*1deg));transition:transform .15s linear}
.ovl{perspective:1200px}

/* bounce animations */
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cardIn{from{opacity:0;transform:perspective(1100px) rotateX(14deg) scale(var(--zs,.12));filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cardOut{to{opacity:0;transform:perspective(1100px) rotateX(10deg) scale(var(--zs,.12));filter:blur(6px)}}
@keyframes appOpen{from{opacity:0;transform:scale(calc(1 - (1 - var(--zs,.12))*.16));filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.ovl-card{transform-origin:var(--ox,50%) var(--oy,50%)}
html[data-anim="on"] #app{transform-origin:var(--ox,50%) var(--oy,20%)}
html[data-anim="on"] #app.opening{animation:appOpen calc(.75s*var(--dur)) var(--ease) backwards}
@keyframes fadeOut{to{opacity:0}}
html[data-anim="on"] #app .wrap>*{animation:rise calc(.75s*var(--dur)) var(--ease) backwards}
html[data-anim="on"] #app .wrap>:nth-child(2){animation-delay:calc(.07s*var(--dur))}
html[data-anim="on"] #app .wrap>:nth-child(3){animation-delay:calc(.14s*var(--dur))}
html[data-anim="on"] #app .wrap>:nth-child(4){animation-delay:calc(.21s*var(--dur))}
html[data-anim="on"] #app .wrap>:nth-child(n+5){animation-delay:calc(.28s*var(--dur))}
html[data-anim="on"] #app.leaving{opacity:0;transform:scale(.95) translateY(16px);filter:blur(6px);
  transition:opacity calc(.17s*var(--dur)) ease-in,transform calc(.17s*var(--dur)) cubic-bezier(.6,-.28,.74,.05),filter calc(.17s*var(--dur)) ease-in}
html[data-anim="on"] .ovl.open .ovl-card{animation:cardIn calc(.6s*var(--dur)) var(--ease)}
html[data-anim="on"] .ovl.open .ovl-card.again{animation:none}
html[data-anim="on"] .ovl.closing{animation:fadeOut calc(.28s*var(--dur)) ease-in forwards}
html[data-anim="on"] .ovl.closing .ovl-card{animation:cardOut calc(.34s*var(--dur)) cubic-bezier(.55,-.2,.75,.1) forwards}
html[data-anim="on"] .menu{display:block;opacity:0;visibility:hidden;pointer-events:none;transform-origin:top right;transform:scale(.7) translateY(-14px);animation:none;
  transition:transform calc(.5s*var(--dur)) var(--ease),opacity calc(.2s*var(--dur)),visibility 0s calc(.3s*var(--dur))}
html[data-anim="on"] .menu.open{opacity:1;visibility:visible;pointer-events:auto;transform:none;animation:none;transition-delay:0s}
html[data-anim="on"] :is(.btn,.icon-btn,.lang-pill,.pill,.cat-tile,.res-card,.tfa,.potd,.panel,.cat-chip,.dl-btn,.more-btn,.cat-more,.mi,.cat-tabs button,.lang-list button,.ovl-x,.rank,.otd){
  transition:transform calc(.55s*var(--dur)) var(--ease),box-shadow .3s,background-color .2s,border-color .2s,color .2s}
html[data-anim="on"] :is(.btn,.icon-btn,.lang-pill,.pill,.dl-btn,.more-btn,.cat-chip,.ovl-x,.cat-more):active{transform:scale(.92)}
html[data-anim="on"] .mi:active{transform:scale(.97)}
html[data-anim="on"] .toast{transition:opacity .2s,transform calc(.5s*var(--dur)) var(--ease)}

/* settings panel */
.menu input.fxr{height:20px;border:none;background:transparent;padding:0;margin:2px 0 0;width:100%;accent-color:var(--rust)}
.menu input.fxc{width:18px;height:18px;margin:0;padding:0;accent-color:var(--rust);flex-shrink:0}

.fxrow small{font-family:var(--mono);font-size:10px;color:var(--dim)}

<body>
<div class="glass-bg" id="gbg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i></div>

<script>
/* ================= state & helpers ================= */
let currentLanglinks = [];     // translations of the article on screen
const state = {
  lang: localStorage.getItem('w20-lang') || 'en',
  langName: localStorage.getItem('w20-lang-name') || 'English',
  langs: null,          // sitematrix
  credits: {},          // file title -> {artist, license, page}
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* jsq: percent-encode a title for safe use inside a single-quoted JS string in an HTML attribute */
const jsq = s => encodeURIComponent(String(s==null?'':s)).replace(/'/g,'%27').replace(/"/g,'%22');
const nf = n => Number(n||0).toLocaleString('en-IN');
const app = () => document.getElementById('app');

const ua = {'Api-User-Agent':'Wikipedia2.0/1.0 (design study)'};
async function jget(url){
  const r = await fetch(url, {headers: ua});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function wp(lang, params){
  const p = new URLSearchParams(Object.assign({format:'json', formatversion:'2', origin:'*'}, params));
  return jget(`https://${lang}.wikipedia.org/w/api.php?${p}`);
}
function rest(lang, path){ return jget(`https://${lang}.wikipedia.org/api/rest_v1/${path}`); }
function commons(params){
  const p = new URLSearchParams(Object.assign({format:'json', formatversion:'2', origin:'*'}, params));
  return jget(`https://commons.wikimedia.org/w/api.php?${p}`);
}
function feedPath(){
  const d = new Date(), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${dd}`;
}
const feed = lang => jget(`https://api.wikimedia.org/feed/v1/wikipedia/${lang}/featured/${feedPath()}`);

/* ================= language list ================= */
async function loadLangs(){
  if(state.langs) return state.langs;
  const cached = localStorage.getItem('w20-langs2');
  if(cached){ try{ state.langs = JSON.parse(cached); return state.langs; }catch(e){} }
  try{
    const d = await wp('en', {action:'sitematrix', smtype:'language'});
    const arr = [];
    Object.entries(d.sitematrix||{}).forEach(([k,v])=>{
      if(!/^\d+$/.test(k) || !v.site) return;
      const main = v.site.find(s=>s.code===v.code) || v.site[0];
      arr.push({code:v.code, name:v.localname||v.name, native:v.name||v.localname||v.code, closed:!!v.closed});
    });
    arr.sort((a,b)=>a.code.localeCompare(b.code));
    state.langs = arr;
    localStorage.setItem('w20-langs2', JSON.stringify(arr));
  }catch(e){ state.langs = [{code:'en',name:'English',native:'English'}]; }
  return state.langs;
}

/* ================= image credits ================= */
function normFile(t){ return String(t||'').replace(/^File:/,'').replace(/_/g,' ').toLowerCase(); }
function fileFromUrl(u){
  const clean = String(u||'').split('?')[0];
  const m = clean.match(/\/(?:thumb\/[^/]+\/[^/]+\/)?([^/]+?\.(?:jpg|jpeg|png|gif|webp|tif|tiff))(?:\/|$)/i);
  return m ? 'File:' + decodeURIComponent(m[1]).replace(/^\d+px-/,'') : '';
}
function creditLine(cr, file){
  const view = file
    ? `<button class="lnk" onclick="event.preventDefault();event.stopPropagation();openImage(decodeURIComponent('${jsq(file)}'))">View file ↗</button>`
    : '';
  return cr ? `<b>${esc(cr.artist)}</b> · ${esc(cr.license)}${view?` · ${view}`:''}`
            : `Wikimedia Commons${view?` · ${view}`:''}`;
}
async function loadCredits(files){
  const todo = files.filter(f=>!state.credits[normFile(f)]).slice(0,45);
  if(!todo.length) return;
  try{
    const d = await commons({action:'query', titles:todo.join('|'), prop:'imageinfo', iiprop:'extmetadata|url', iiurlwidth:'900'});
    (d.query?.pages||[]).forEach(p=>{
      const ii = (p.imageinfo||[])[0]; if(!ii) return;
      const em = ii.extmetadata||{};
      const g = k => String(em[k]?.value||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
      state.credits[normFile(p.title)] = {
        artist: g('Artist') || g('Credit') || 'Unknown author',
        license: g('LicenseShortName') || g('UsageTerms') || 'See file page',
        page: ii.descriptionurl || '',
        licenseUrl: g('LicenseUrl'),
        thumb: ii.thumburl || ''
      };
    });
  }catch(e){}
}

/* ================= search ================= */
let searchTimer = null, lastQuery = '';

/* ================= article ================= */
function cleanArticle(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  root.querySelectorAll('style,script,link,meta,.mw-editsection,sup.reference,.navbox,.vertical-navbox,'+
    '.sistersitebox,.ambox,.metadata,.hatnote,.mw-references-wrap,.reflist,#toc,.printfooter,.mw-empty-elt,'+
    '.shortdescription,.mw-cite-backlink,.reference,.noprint,.mw-jump-link,.mw-indicators,.side-box,'+
    '.mbox-small,.mw-hidden-catlinks,.catlinks,.navigation-not-searchable,.portal,.mw-authority-control').forEach(el=>el.remove());
  // <picture><source srcset="//..."> inherits file:// scheme — normalise or drop
  root.querySelectorAll('video,audio').forEach(v=>v.remove());
  root.querySelectorAll('source').forEach(src=>{
    const ss = (src.getAttribute('srcset')||'').split(',').map(x=>x.trim()).filter(Boolean)
      .map(x=>{ const [u,...d] = x.split(/\s+/);
                const a = u.startsWith('//') ? 'https:'+u : (/^https?:/i.test(u) ? u : '');
                return a ? [a,...d].join(' ') : ''; })
      .filter(Boolean);
    if(ss.length) src.setAttribute('srcset', ss.join(', ')); else src.remove();
  });
  root.querySelectorAll('img').forEach(img=>{
    const abs = u => {
      if(!u) return '';
      u = u.split('?')[0];
      if(u.startsWith('//')) return 'https:'+u;
      if(/^https?:/i.test(u)) return u;
      return '';                       // relative srcset entries are unusable
    };
    const srcset = img.getAttribute('srcset')||'';
    const orig = abs(img.getAttribute('src'));
    let best = '';
    if(srcset){
      const parts = srcset.split(',').map(x=>x.trim().split(/\s+/)[0]).filter(Boolean);
      best = abs(parts[parts.length-1]||'');
    }
    img.removeAttribute('srcset'); img.removeAttribute('width'); img.removeAttribute('height');
    const final = best || orig;
    if(!final || /^https?:\/\/maps\.wikimedia\.org/i.test(final)){ img.remove(); return; }
    img.setAttribute('src', final);
    img.dataset.fb = orig;
    img.setAttribute('loading','lazy');
    img.setAttribute('alt', img.getAttribute('alt')||'');
    img.addEventListener('error', ()=>{
      if(img.dataset.fb && img.src !== img.dataset.fb){ img.src = img.dataset.fb; img.dataset.fb = ''; }
    });
  });
  root.querySelectorAll('table').forEach(t=>{
    if(t.classList.contains('infobox')) return;
    const w = doc.createElement('div'); w.className='table-wrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll('h2,h3,h4').forEach((h,i)=>{
    if(!h.id) h.id = 'h'+i;
  });
  [...root.querySelectorAll('h2,h3,h4')].forEach(h=>{
    const block = h.closest('.mw-heading') || h;
    let n = block.nextElementSibling, has = false;
    while(n && !/^H[2-4]$/.test(n.tagName) && !n.querySelector('h2,h3,h4')){
      if(n.textContent.trim().length > 3 || n.querySelector('img')){ has = true; break; }
      n = n.nextElementSibling;
    }
    if(!has) block.remove();
  });
  return root;
}

async function viewArticle(title){
  const lang = state.lang;
  app().innerHTML = `<div class="wrap"><div class="crumbs"><a onclick="go('#/')">Home</a><span>/</span>
    <span>${esc(state.langName)}</span></div>
    <div style="padding:26px 0"><div class="skel" style="height:54px;width:60%;margin-bottom:14px"></div>
    <div class="skel" style="height:22px;width:40%;margin-bottom:30px"></div>
    <div class="skel" style="height:300px"></div></div></div>`;

  let parse, summary, media, catsD;
  try{
    [parse, summary, media, catsD] = await Promise.all([
      wp(lang, {action:'parse', page:title, prop:'text|displaytitle|langlinks', redirects:'1', disableeditsection:'1', disabletoc:'1'}),
      rest(lang, 'page/summary/'+encodeURIComponent(title.replace(/ /g,'_'))).catch(()=>null),
      rest(lang, 'page/media-list/'+encodeURIComponent(title.replace(/ /g,'_'))).catch(()=>null),
      wp(lang, {action:'query', titles:title, prop:'categories', cllimit:'32', clshow:'!hidden', redirects:'1'}).catch(()=>null)
    ]);
  }catch(err){
    app().innerHTML = `<div class="wrap"><div class="crumbs"><a onclick="go('#/')">Home</a></div>
      <div class="errbox"><h3>Couldn't load “${esc(title)}”</h3>
      <p>${esc(err.message)} — the article may not exist in ${esc(state.langName)} Wikipedia. Try another language, or search for something else.</p></div></div>`+footer();
    return;
  }
  if(parse.error){
    app().innerHTML = `<div class="wrap"><div class="crumbs"><a onclick="go('#/')">Home</a></div>
      <div class="errbox"><h3>No such article in ${esc(state.langName)}</h3>
      <p>“${esc(title)}” doesn't exist in this language edition. Switch language from the top bar, or search instead.</p></div></div>`+footer();
    return;
  }

  const P = parse.parse;
  const root = cleanArticle(P.text);
  const realTitle = summary?.title || P.title;
  const desc = summary?.description || '';
  const canonical = summary?.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(realTitle.replace(/ /g,'_'))}`;
  const langlinks = P.langlinks || [];
  currentLanglinks = langlinks;
  let langMap = {};
  try{
    const ls = await loadLangs();
    ls.forEach(l=>{ langMap[l.code] = l.native || l.name || l.code; });
  }catch(e){}
  const langNameOf = c => langMap[c] || c;
  const sortedLL = [...langlinks].sort((a,b)=>langNameOf(a.lang).localeCompare(langNameOf(b.lang)));

  // image credits
  const files = (media?.items||[]).filter(i=>i.type==='image' && i.title).map(i=>i.title);
  const fileMap = {};
  (media?.items||[]).forEach(i=>{ if(i.title) fileMap[normFile(i.title)] = i.title; });
  await loadCredits(files.slice(0,45));

  // wrap images with credit captions
  root.querySelectorAll('img').forEach(img=>{
    const key = normFile(fileFromUrl(img.getAttribute('src')));
    const cr = state.credits[key];
    const line = document.createElement('span');
    line.className = 'cr';
    const ft0 = fileFromUrl(img.getAttribute('src'));
    line.innerHTML = `<span class="cr-txt">${creditLine(cr, ft0)}</span>` +
      `<button class="dl-btn" data-dl="${esc(ft0)}" data-src="${esc(img.getAttribute('src'))}"` +
      ` data-thumb="${esc(cr?.thumb||'')}">↓ Download</button>`;
    img.addEventListener('error', ()=>{ const f = img.closest('figure'); if(f) f.style.display='none'; else img.style.display='none'; });
    const fig = img.closest('figure');
    if(fig){
      fig.classList.add('wp-fig');
      const cap = fig.querySelector('figcaption');
      if(cap) cap.appendChild(line); else fig.appendChild(line);
    } else if(!img.closest('.infobox')){
      const w = document.createElement('figure'); w.className='wp-fig';
      img.parentNode.insertBefore(w, img); w.appendChild(img); w.appendChild(line);
    }
    const ft = fileFromUrl(img.getAttribute('src'));
    if(ft){
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); openImage(ft); });
    }
  });

  // every Wikipedia link resolves inside the app
  root.querySelectorAll('a').forEach(a=>{
    let href = a.getAttribute('href')||'';
    if(!href || href.startsWith('#')) return;
    const inApp = t => { a.setAttribute('href','#/a/'+encodeURIComponent(t)); a.removeAttribute('target'); a.removeAttribute('rel'); };
    const asFile = t => { a.setAttribute('href','#'); a.removeAttribute('target');
      a.onclick = e => { e.preventDefault(); e.stopPropagation(); openImage(t); }; };

    const absWp = href.match(/^https?:\/\/[a-z-]+\.(?:m\.)?wikipedia\.org\/wiki\/(.+)$/i);
    if(absWp){ const t = decodeURIComponent(absWp[1]).replace(/_/g,' ');
      if(/^(File|Image):/i.test(t)) asFile(t.replace(/^(File|Image):/i,'File:')); else inApp(t); return; }
    if(href.startsWith('/wiki/')){ const t = decodeURIComponent(href.slice(6)).replace(/_/g,' ');
      if(/^(File|Image):/i.test(t)) asFile(t.replace(/^(File|Image):/i,'File:')); else inApp(t); return; }
    const wm = href.match(/\/w\/index\.php\?(?:.*&)?title=([^&]+)/);

function filterArtLangs(q){

function switchLang(code){
  const target = titleInLang(code);
  state.lang = code;
  const l = (state.langs||[]).find(x=>x.code===code);
  state.langName = l ? (l.native||l.name) : code;
  localStorage.setItem('w20-lang', state.lang);
  localStorage.setItem('w20-lang-name', state.langName);
  updateLangLabel();
  if(target) navTo('#/a/' + encodeURIComponent(target));
  else route();

function bindToc(){
  const links = [...document.querySelectorAll('[data-toc]')];
  if(!links.length) return;
  const obs = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting) links.forEach(l=>l.classList.toggle('on', l.dataset.toc===e.target.id));
    });
  }, {rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('.prose h2, .prose h3').forEach(el=>obs.observe(el));
}

/* ================= pull to refresh ================= */
let ptrPulling = false, ptrStart = 0, ptrDist = 0;
const PTR_THRESHOLD = 74;

function ptrEl(){ return document.getElementById('ptr'); }

function ptrReset(){
  const el = ptrEl();
  if(!el) return;
  el.classList.remove('on','ready','spin');
  el.style.transform = '';
  ptrPulling = false; ptrDist = 0;
}

async function refreshLatest(){
  const el = ptrEl();
  if(el) el.classList.add('spin');
  toast('Refreshing…');
  // drop the cached counts and any stale view, then re-fetch
  countsMemo = null;
  try{ localStorage.removeItem('w20-counts-' + state.lang); }catch(e){}
  const h = location.hash || '#/';
  if(h.startsWith('#/a/')) await viewArticle(decodeURIComponent(h.slice(4)));
  else if(h.startsWith('#/cc/')) await viewCommonsCategory(decodeURIComponent(h.slice(5)));
  else if(h.startsWith('#/c-en/')) await viewCategory(decodeURIComponent(h.slice(7)), 'en');
  else if(h.startsWith('#/c/')) await viewCategory(decodeURIComponent(h.slice(4)));
  else if(h.startsWith('#/life')) await viewLife();
  else if(h.startsWith('#/credits')){ app().innerHTML = viewCredits(); fillCoverage(); }
  else await viewHome();
  const t = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  if(el){ el.classList.remove('spin'); }
  ptrReset();
  toast('Updated · ' + t);
}

function bindPullToRefresh(){
  if(window.__ptrBound) return;
  window.__ptrBound = 1;

  document.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    if((window.scrollY || document.documentElement.scrollTop) > 0) return;
    if(document.getElementById('ovl')?.classList.contains('open')) return;
    const hdr = document.querySelector('header.top');
    const el0 = ptrEl();
    if(el0 && hdr) el0.style.top = Math.round(hdr.getBoundingClientRect().height + 6) + 'px';
    ptrPulling = true; ptrStart = e.touches[0].clientY; ptrDist = 0;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if(!ptrPulling) return;
    const y = e.touches[0].clientY;
    const d = y - ptrStart;
    if(d <= 0 || (window.scrollY || 0) > 0){ ptrReset(); return; }
    ptrDist = d;
    e.preventDefault();
    const el = ptrEl();
    if(!el) return;
    el.classList.add('on');
    const pull = Math.min(d * 0.55, 84);
    el.style.transform = 'translateY(' + (pull - 46) + 'px)';
    el.classList.toggle('ready', d >= PTR_THRESHOLD);
  }, {passive:false});

  document.addEventListener('touchend', () => {
    if(!ptrPulling) return;
    const go = ptrDist >= PTR_THRESHOLD;
    ptrPulling = false;
    if(go) refreshLatest(); else ptrReset();
  }, {passive:true});

  document.addEventListener('touchcancel', ptrReset, {passive:true});
}

/* ================= downloads ================= */
function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2800);
}
function cleanName(file, url){
  let n = String(file||'').replace(/^File:/,'').replace(/_/g,' ').trim();
  if(!n){ n = decodeURIComponent((String(url||'').split('?')[0].split('/').pop())||'image'); n = n.replace(/^\d+px-/,''); }
  if(!/\.(jpe?g|png|gif|webp|svg|tiff?)$/i.test(n)) n += '.jpg';
  return n;
}
async function downloadImage(src, file, thumb){
  let url = thumb || src;
  const name = cleanName(file, url);
  toast('Preparing ' + name + '…');
  try{
    if(file){
      try{
        const d = await commons({action:'query', titles:file, prop:'imageinfo', iiprop:'url', iiurlwidth:'1600'});
        const ii = (d.query?.pages||[])[0]?.imageinfo?.[0];
        if(ii?.thumburl) url = ii.thumburl;
      }catch(e){}
    }
    const r = await fetch(url, {mode:'cors'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob = await r.blob();
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(href), 10000);
    toast('Saved ' + name);
  }catch(e){
    window.open(url, '_blank', 'noopener');
    toast('Opened image in a new tab — save it from there');
  }
}
function bindDownloads(scope){
  (scope||document).querySelectorAll('[data-dl]:not([data-bound])').forEach(btn=>{
    btn.setAttribute('data-bound','1');
    btn.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      downloadImage(btn.dataset.src||'', btn.dataset.dl||'', btn.dataset.thumb||'');
    });
  });
}

/* ================= in-app overlays ================= */
let ovT;
const lastPt = {x:0,y:0,t:0};
addEventListener('pointerdown', e=>{ lastPt.x=e.clientX; lastPt.y=e.clientY; lastPt.t=Date.now(); }, true);
function overlay(html){
  const o = document.getElementById('ovl');
  clearTimeout(ovT);
  const again = o.classList.contains('open') && !o.classList.contains('closing');
  o.classList.remove('closing');
  o.innerHTML = `<div class="ovl-card${again?' again':''}">${html}</div>`;
  o.classList.add('open');
  const card = o.firstChild;
  if(card && !again){
    const fresh = Date.now()-lastPt.t < 1500;
    card.style.setProperty('--ox', fresh ? (lastPt.x-card.offsetLeft)+'px' : '50%');
    card.style.setProperty('--oy', fresh ? (lastPt.y-card.offsetTop)+'px' : '50%');
  }
  document.body.style.overflow = 'hidden';
}
function closeOverlay(){
  const o = document.getElementById('ovl');
  const fin = ()=>{ o.classList.remove('open','closing'); o.innerHTML=''; document.body.style.overflow=''; };
  clearTimeout(ovT);
  if(o.classList.contains('open') && fx.anim){ o.classList.add('closing'); ovT = setTimeout(fin, 340*fx.dur); } else fin();
}
function ovlHead(title){
  return `<div class="ovl-head"><div class="ovl-t">${esc(title)}</div>

}

  try{

    if(!ii){

      return;
    }
    const em = ii.extmetadata||{};
    const g = k => String(em[k]?.value||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
    const date = (g('DateTimeOriginal')||g('DateTime')||'').slice(0,10);

        </div>
        <div class="ovl-grid">

          <div><span class="mono">Licence</span><div><span class="lic-badge">${esc(g('LicenseShortName')||'See file page')}</span></div></div>
          <div><span class="mono">Original size</span><div>${nf(ii.width)} × ${nf(ii.height)} px</div></div>
          <div><span class="mono">Uploaded</span><div>${esc(date||'—')}</div></div>
        </div>

  }

function cleanComment(c){
  return String(c||'')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2')
    .replace(/\[\[([^\]]+)\]\]/g,'$1')
    .replace(/\/\*\s*(.*?)\s*\*\//g,'[$1] ')
    .replace(/\s+/g,' ').trim();
}

async function openHistory(title){
  ovlLoading('Edit history — ' + title, 220);
  try{
    const d = await wp(state.lang, {action:'query', prop:'revisions', titles:title, rvlimit:'40',
      rvprop:'user|timestamp|comment|size|ids', rvdir:'older'});
    const p = (d.query?.pages||[])[0];
    const revs = p?.revisions || [];
    if(!revs.length){ overlay(ovlHead('Edit history') + `<div style="padding:24px">No revisions found.</div>`); return; }
    overlay(ovlHead(`Edit history — ${title}`) + `<div class="ovl-body">
      <p style="font-size:13px;color:var(--dim);margin:0 0 14px">
        The ${revs.length} most recent edits in ${esc(state.langName)} Wikipedia. Every name here is one of this
        article's authors — this is the attribution CC BY-SA 4.0 asks for.</p>
      ${revs.map(r=>{
        const t = new Date(r.timestamp);
        const when = t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+
                     t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

const LIFE_ALL = [...new Set(LIFE_GROUPS.flatMap(g=>g.cats))];

async function resolveCats(names){
  if(state.lang === 'en'){ const o={}; names.forEach(n=>o[n]=n); return o; }
  const key = 'w20-life-' + state.lang;
  const cached = localStorage.getItem(key);
  if(cached){ try{ const o = JSON.parse(cached); if(names.every(n=>o[n])) return o; }catch(e){} }
  const out = {};
  try{
    for(let i=0;i<names.length;i+=40){
      const chunk = names.slice(i,i+40).map(n=>'Category:'+n).join('|');
      const d = await wp('en', {action:'query', prop:'langlinks', titles:chunk, lllang:state.lang, lllimit:'max'});
      (d.query?.pages||[]).forEach(pg=>{
        const base = pg.title.replace(/^[^:]+:/,'');
        const ll = (pg.langlinks||[])[0];
        out[base] = ll ? ll.title.replace(/^[^:]+:/,'') : base;
      });
    }
    names.forEach(n=>{ if(!out[n]) out[n]=n; });
    localStorage.setItem(key, JSON.stringify(out));
  }catch(e){ names.forEach(n=>out[n]=n); }
  return out;
}

async function catCounts(names, lang){
  const L = lang || state.lang;
  const info = {};
  try{
    for(let i=0;i<names.length;i+=50){
      const d = await wp(L, {action:'query', prop:'categoryinfo',
        titles: names.slice(i,i+50).map(n=>'Category:'+n).join('|')});
      (d.query?.pages||[]).forEach(pg=>{
        info[pg.title.replace(/^[^:]+:/,'')] = pg.categoryinfo || {};
      });
    }
  }catch(e){}
  return info;
}

let countsMemo = null;
async function fetchCounts(){
  const key = 'w20-counts-' + state.lang;
  if(countsMemo && countsMemo.lang === state.lang) return countsMemo.v;
  try{
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if(c && Date.now() - c.t < 3600000){ countsMemo = {lang:state.lang, v:c.v}; return c.v; }
  }catch(e){}
  let v = {};
  try{
    const [w, cm] = await Promise.all([
      wp(state.lang, {action:'query', meta:'siteinfo', siprop:'statistics'}).catch(()=>null),
      commons({action:'query', meta:'siteinfo', siprop:'statistics'}).catch(()=>null)
    ]);
    const ws = w?.query?.statistics || {}, cs = cm?.query?.statistics || {};
    v = { articles: ws.articles||0, pages: ws.pages||0, edits: ws.edits||0, images: ws.images||0,
          users: ws.users||0, cimages: cs.images||0, cpages: cs.pages||0, cedges: cs.edits||0,
          editions: (state.langs||[]).length || 0 };
    localStorage.setItem(key, JSON.stringify({t:Date.now(), v}));
  }catch(e){}
  countsMemo = {lang:state.lang, v};
  return v;
}

async function fillTopStats(){
  const box = document.getElementById('topStats');
  if(!box) return;
  const v = await fetchCounts();
  if(!v || !v.articles){ box.innerHTML = '<div class="ts-cell skelcell">counts unavailable</div>'; return; }
  const cells = [
    [v.articles, `articles · ${state.langName}`],
    [v.pages,    `pages · ${state.langName}`],
    [v.edits,    `edits · ${state.langName}`],
    [v.cimages,  'Commons files'],
    [v.editions, 'language editions']
  ];
  box.innerHTML = cells.map(([n,l])=>`<div class="ts-cell"><b>${nf(n)}</b><span>${esc(l)}</span></div>`).join('');
  const note = document.getElementById('tsNote');
  if(note) note.textContent = `Live counts · ${state.langName} Wikipedia and Wikimedia Commons · switch language to change them`;
}

async function fillCoverage(){

  clearTimeout(catTimer);

async function catLoad(reset){
  if(catB.busy) return;
  catB.busy = true;
  const list = document.getElementById('catList');
  const more = document.getElementById('catMore');
  if(!list){ catB.busy = false; return; }
  if(reset){ list.innerHTML = '<div class="skel" style="height:180px"></div>'; if(more) more.innerHTML=''; }
  else if(more) more.innerHTML = '<div class="cat-more" style="display:grid;place-items:center">Loading…</div>';

  const isC = catB.source === 'commons';
  const api = isC ? commons : (params)=>wp(state.lang, params);
  const q = catB.q;
  let params;
  if(q){
    params = { action:'query', list:'search', srsearch:q, srnamespace:'14', srlimit:'40', srprop:'' };
  } else {
    params = { action:'query', list:'allcategories', aclimit:'60' };
  }
  if(catB.cont) Object.assign(params, catB.cont);

  try{
    const d = await api(params);
    let rows = [];
    if(q) rows = (d.query?.search||[]).map(x=>x.title.replace(/^[^:]+:/,''));
    else rows = (d.query?.allcategories||[]).map(x=>x.category);
    catB.cont = d.continue || null;

    const html = rows.map(n=>`<div class="cat-row" onclick="closeOverlay();${isC?'openCommonsCategory':'openCategory'}(decodeURIComponent('${jsq(n)}'))">
        <span class="cn">${esc(n)}</span><span class="go">${isC?'files':'open'} →</span></div>`).join('');

    if(reset) list.innerHTML = html || `<p style="font-size:14px;color:var(--dim)">Nothing found for “${esc(q)}”.</p>`;
    else list.insertAdjacentHTML('beforeend', html);

    if(more) more.innerHTML = catB.cont
      ? `<button class="cat-more" onclick="catLoad(false)">Load more →</button>`
      : (rows.length ? `<p style="font-size:12px;color:var(--dim);text-align:center;padding-top:12px">
          End of this page — refine your search to reach deeper.</p>` : '');
  }catch(e){
    if(reset) list.innerHTML = `<p style="font-size:14px;color:var(--dim)">Could not load categories: ${esc(e.message)}</p>`;
    if(more) more.innerHTML = '';
  }
  catB.busy = false;
}

    </header>
    ${subNames.length?`<section style="margin-bottom:28px">
      <div class="sect-head" style="margin:0 0 13px"><h2 style="font-size:21px"><span class="dot-i"></span>Subcategories</h2></div>
      <div class="cat-chips">${subNames.map(c=>`<button class="cat-chip"
        onclick="openCommonsCategory(decodeURIComponent('${jsq(c)}'))">${esc(c)}</button>`).join('')}</div>
    </section>`:''}
    <section>
      <div class="sect-head" style="margin:0 0 16px"><h2 style="font-size:21px"><span class="dot-i"></span>Files</h2>
        <span class="mono" style="color:var(--dim)">${items.length} shown</span></div>
      <div class="res-grid" id="cc-grid">${items.map(fileCard).join('') ||
        '<p style="color:var(--dim);font-size:14px;grid-column:1/-1">No files directly here — look in the subcategories.</p>'}</div>
      <div id="cc-more">${ccState.cont?'<button class="more-btn" onclick="loadMoreCommons()">Load more →</button>':''}</div>
    </section>
  </div>
  ${footer()}`;
  window.scrollTo({top:0,behavior:'instant'});
  document.title = name + ' — Commons · Wikipedia 2.0';
}

function fileCard(p){
  const ii = p.imageinfo[0], em = ii.extmetadata||{};
  const g = k => String(em[k]?.value||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  const fn = p.title.replace(/^File:/,'').replace(/_/g,' ');
  return `<div class="res-card" onclick="openImage(decodeURIComponent('${jsq(p.title)}'))">
    <div class="th"><img src="${ii.thumburl||ii.url}" alt="" loading="lazy"></div>
    <div class="bd"><b>${esc(fn)}</b><span>${esc(g('Artist')||'Unknown')} · ${esc(g('LicenseShortName')||'')}</span></div>
  </div>`;
}

async function loadMoreCommons(){
  if(!ccState.cont) return;
  const btn = document.querySelector('#cc-more .more-btn');
  if(btn){ btn.textContent='Loading…'; btn.disabled = true; }
  try{
    const d = await commons(Object.assign({action:'query', generator:'categorymembers', gcmtitle:ccState.title,
      gcmnamespace:'6', prop:'imageinfo', iiprop:'url|extmetadata|size', iiurlwidth:'420'}, ccState.cont));
    const items = Object.values(d.query?.pages||{}).filter(p=>p.imageinfo?.[0]);
    ccState.cont = d.continue || null;
    const grid = document.getElementById('cc-grid');
    items.forEach(p=>{ const div=document.createElement('div'); div.innerHTML=fileCard(p); grid.appendChild(div.firstElementChild); });
    document.getElementById('cc-more').innerHTML = ccState.cont
      ? '<button class="more-btn" onclick="loadMoreCommons()">Load more →</button>' : '';
  }catch(e){ document.getElementById('cc-more').innerHTML=''; }
}

function openCommonsCategory(n){ go('#/cc/' + encodeURIComponent(String(n).replace(/^[^:]+:/,''))); }

/* ================= language menu ================= */
function toggleMore(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('moreMenu');
  if(m.classList.contains('open')){ m.classList.remove('open'); return; }
  document.getElementById('langMenu').classList.remove('open');
  const dark = (document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  m.innerHTML = `
    <div class="mh">Options</div>
    <div class="mi" onclick="event.stopPropagation();openFxPanel()"><span>Glass, depth &amp; motion</span><small>adjust ›</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');toggleLang(event)">
      <span>Change language</span><small>${esc(state.langName)}</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');refreshLatest()">
      <span>Refresh</span><small>latest</small></div>
    <div class="mi" onclick="toggleTheme();toggleMore()">
      <span>${dark?'Light mode':'Dark mode'}</span><small>${dark?'☀':'☾'}</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');go('#/life')">
      <span>Life on Earth</span><small>animals</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');openAllCategories('wiki')">
      <span>All categories</span><small>wikipedia</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');openAllCategories('commons')">
      <span>Commons categories</span><small>files</small></div>
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');location.hash='#/credits'">
      <span>Credits &amp; licences</span><small>cc by-sa</small></div>`;
  m.classList.add('open');
}

async function toggleLang(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('langMenu');
  if(m.classList.contains('open')){ m.classList.remove('open'); return; }
  m.classList.add('open');
  m.innerHTML = '<div class="mh">Loading languages…</div>';
  const langs = await loadLangs();
  m.innerHTML = `<div class="mh">Reading language</div>
    <input id="langSearch" placeholder="Filter ${langs.length} languages…" oninput="filterLangs(this.value)">
    <div id="langItems">${langs.map(l=>`
      <div class="mi ${l.code===state.lang?'on':''}" data-code="${l.code}" data-name="${esc((l.native||'')+' '+(l.name||'')+' '+l.code)}"
           onclick="pickLang('${l.code}','${esc(l.native||l.name)}')">
        <span>${esc(l.native||l.name)}</span><small>${esc(l.name||l.code)}</small></div>`).join('')}</div>
    <div class="mf">Every open Wikipedia edition · ${langs.length} languages</div>`;
  document.getElementById('langSearch')?.focus();
}
function filterLangs(q){
  q = q.toLowerCase();
  document.querySelectorAll('#langItems .mi').forEach(el=>{
    el.style.display = el.dataset.name.toLowerCase().includes(q) || el.dataset.code.includes(q) ? '' : 'none';
  });
}
function pickLang(code, name){
  document.getElementById('langMenu').classList.remove('open');
  const onArticle = location.hash.startsWith('#/a/');
  const target = onArticle ? titleInLang(code) : '';
  state.lang = code; state.langName = name;
  localStorage.setItem('w20-lang', code); localStorage.setItem('w20-lang-name', name);
  updateLangLabel();
  if(target){ navTo('#/a/' + encodeURIComponent(target)); return; }
  navTo('#/');
}
function updateLangLabel(){ document.getElementById('langLabel').textContent = state.langName; }

/* ================= misc ================= */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const next = cur==='dark' ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('w20-theme', next);
}
async function randomArticle(){
  app().innerHTML = `<div class="wrap"><div style="padding:60px 0"><div class="skel" style="height:200px"></div></div></div>`;
  try{
    const d = await wp(state.lang, {action:'query', list:'random', rnlimit:'1', rnnamespace:'0'});
    const t = d.query?.random?.[0]?.title;
    if(!t) throw new Error('no random article');
    go('#/a/'+encodeURIComponent(t));
  }catch(e){
    go('#/'); setTimeout(()=>viewHome(),10);
  }
}
function go(h){ location.hash = h; }
function navTo(h){ if(location.hash === h) route(); else location.hash = h; }
function titleInLang(code){
  const l = (currentLanglinks||[]).find(x=>x.lang === code);
  return l && l.title ? l.title : '';
}
let rtT;
function route(){
  const a = app();
  if(!fx.anim || !a.firstChild){ routeCore(); return; }
  const r = a.getBoundingClientRect(), fresh = Date.now()-lastPt.t < 1500;
  a.style.setProperty('--ox', fresh ? (lastPt.x-r.left)+'px' : '50%');
  a.style.setProperty('--oy', fresh ? (lastPt.y-r.top)+'px' : '20%');
  a.classList.remove('opening'); a.classList.add('leaving'); clearTimeout(rtT);
  rtT = setTimeout(()=>{
    a.classList.remove('leaving'); routeCore();
    void a.offsetWidth; a.classList.add('opening');
    setTimeout(()=>a.classList.remove('opening'), 800*fx.dur);
  }, 170*fx.dur);
}
function routeCore(){
  const h = location.hash || '#/';
  if(!h.startsWith('#/a/')) currentLanglinks = [];
  if(h.startsWith('#/a/')){
    const t = decodeURIComponent(h.slice(4));
    if(/^File:/i.test(t)){ if(!document.querySelector('.art-head')) viewHome(); setTimeout(()=>openImage(t),250); return; }
    if(/^Category:/i.test(t)){ go('#/c/' + encodeURIComponent(t.replace(/^Category:/,''))); return; }
    if(/^Special:/i.test(t)){
      if(/random/i.test(t)) return randomArticle();
      if(/search/i.test(t)){ document.getElementById('q')?.focus(); return; }
      go('#/'); return;
    }
    viewArticle(t);
  }
  else if(h.startsWith('#/life')) { viewLife(); }
  else if(h.startsWith('#/cc/')) { viewCommonsCategory(decodeURIComponent(h.slice(5))); }
  else if(h.startsWith('#/c-en/')) { viewCategory(decodeURIComponent(h.slice(7)), 'en'); }
  else if(h.startsWith('#/c/')) { viewCategory(decodeURIComponent(h.slice(4))); }
  else if(h.startsWith('#/credits')) { app().innerHTML = viewCredits(); window.scrollTo({top:0}); fillCoverage(); }
  else { viewHome(); window.scrollTo({top:0}); }
  document.title = h.startsWith('#/a/') ? 'Article — Wikipedia 2.0' : 'Wikipedia 2.0 — live';
}

document.addEventListener('click', ()=>{
  document.getElementById('langMenu').classList.remove('open');
  document.getElementById('moreMenu').classList.remove('open');
});
document.getElementById('q').addEventListener('input', onSearchInput);
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key==='Escape'){ document.getElementById('langMenu').classList.remove('open');
    document.getElementById('moreMenu').classList.remove('open'); closeOverlay(); }
});
window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  document.getElementById('prog').style.width = (p*100).toFixed(1)+'%';
});
window.addEventListener('hashchange', route);

window.addEventListener('error', e=>{
  try{ toast('Something went wrong: ' + (e.message||'unknown error')); }catch(_){}
});
window.addEventListener('unhandledrejection', e=>{
  try{ toast('Request failed: ' + ((e.reason && e.reason.message) || 'network error')); }catch(_){}
});

/* ================= FX engine ================= */
const FXD = {zoom:1,zs:12,glass:1,blur:22,tr:45,shine:60,depth:1,tilt:10,par:1,gyro:0,anim:1,bounce:45,speed:100};
let fx = Object.assign({}, FXD);
try{ Object.assign(fx, JSON.parse(localStorage.getItem('w20-fx')||'{}')); }catch(e){}
function fxApply(){
  const r = document.documentElement, s = r.style;
  fx.dur = 100/Math.max(30,fx.speed);
  r.dataset.glass = fx.glass?'on':'off'; r.dataset.anim = fx.anim?'on':'off';
  r.dataset.depth = fx.depth?'on':'off'; r.dataset.gyro = fx.gyro?'on':'off';
  s.setProperty('--zs', fx.zoom ? fx.zs/100 : .94); s.setProperty('--g-blur', fx.blur+'px'); s.setProperty('--g-a', Math.max(.06,1-fx.tr/100));
  s.setProperty('--g-shine', fx.shine/100); s.setProperty('--dur', fx.dur);
  s.setProperty('--ease', `cubic-bezier(.34,${(1+fx.bounce*.014).toFixed(3)},.64,1)`);
}
function fxSave(){ try{ localStorage.setItem('w20-fx', JSON.stringify(fx)); }catch(e){} }
function fxSet(k,v){
  fx[k]=v; fxSave(); fxApply();
  const l = document.getElementById('fxv-'+k); if(l) l.textContent = v + (l.dataset.u||'');
  if(k==='gyro' && v) gyroOn();
}
function fxReset(){ fx = Object.assign({}, FXD); fxSave(); fxApply(); openFxPanel(); }
const FXMAP = [
  ['Liquid glass',[['sw','glass','Glass effect'],['rg','blur','Blur',0,40,'px'],['rg','tr','Transparency',0,90,'%'],['rg','shine','Edge shine',0,100,'%']]],
  ['4D depth',[['sw','depth','Tilt & depth'],['rg','tilt','Tilt strength',0,25,'°'],['sw','par','Scroll parallax'],['sw','gyro','Phone gyro tilt']]],
  ['Motion',[['sw','anim','Bounce animations'],['sw','zoom','macOS zoom-open'],['rg','zs','Open starts at',5,80,'%'],['rg','bounce','Bounce',0,100,'%'],['rg','speed','Speed',50,200,'%']]]
];
function openFxPanel(){
  const m = document.getElementById('moreMenu');
  m.innerHTML = `<div onclick="event.stopPropagation()">
    <div class="mi" onclick="document.getElementById('moreMenu').classList.remove('open');toggleMore()"><span>‹ Back</span><small>glass · depth · motion</small></div>`
    + FXMAP.map(([h,rows])=>`<div class="mh">${h}</div>` + rows.map(r=> r[0]==='sw'
      ? `<label class="mi"><span>${r[2]}</span><input type="checkbox" class="fxc" ${fx[r[1]]?'checked':''} onchange="fxSet('${r[1]}',this.checked?1:0)"></label>`
      : `<div class="fxrow"><label><span>${r[2]}</span><small id="fxv-${r[1]}" data-u="${r[5]}">${fx[r[1]]}${r[5]}</small></label>
           <input type="range" class="fxr" min="${r[3]}" max="${r[4]}" value="${fx[r[1]]}" oninput="fxSet('${r[1]}',+this.value)"></div>`).join('')).join('')
    + `<div class="mi" onclick="fxReset()"><span>Reset to defaults</span><small>↺</small></div></div>`;
}
/* 4D tilt: perspective rotation + moving glare + shifting shadow */
const TILT_SEL = '.tfa,.potd,.res-card,.cat-tile,.panel,.topstats';
let tEl = null;
function tiltSet(el,e,press){
  const r = el.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
  const a = fx.tilt*Math.min(1,420/r.width);
  el.style.transition = 'transform 90ms linear, box-shadow 90ms linear';
  el.style.transform = `perspective(900px) rotateX(${((.5-py)*2*a).toFixed(2)}deg) rotateY(${((px-.5)*2*a).toFixed(2)}deg) scale(${press?.975:1.02})`;
  el.style.setProperty('--mx',(px*100).toFixed(0)+'%'); el.style.setProperty('--my',(py*100).toFixed(0)+'%');
  el.style.setProperty('--gl',1); el.style.setProperty('--sx',((.5-px)*28).toFixed(1)); el.style.setProperty('--sy',((.5-py)*18).toFixed(1));
}
function tiltEnd(el){
  el.style.transition=''; el.style.transform='';
  ['--gl','--sx','--sy'].forEach(p=>el.style.removeProperty(p));
  if(tEl===el) tEl=null;
}
document.addEventListener('pointermove', e=>{
  if(!fx.depth || e.pointerType==='touch' || document.documentElement.dataset.gyro==='on') return;
  const el = e.target.closest && e.target.closest(TILT_SEL);
  if(tEl && tEl!==el) tiltEnd(tEl);
  if(el){ tEl = el; tiltSet(el,e,false); }
});
document.addEventListener('pointerout', e=>{ if(!e.relatedTarget && tEl) tiltEnd(tEl); });
document.addEventListener('pointerdown', e=>{
  if(!fx.depth) return;
  const el = e.target.closest && e.target.closest(TILT_SEL); if(el){ tEl=el; tiltSet(el,e,true); }
});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{
  if(!tEl) return;
  if(e.pointerType!=='touch' && t==='pointerup') tiltSet(tEl,e,false); else tiltEnd(tEl);
}));
/* gyro (phone) */
function gy(e){
  if(!fx.gyro || !fx.depth) return;
  const c = v=>Math.max(-1,Math.min(1,v)), s = document.documentElement.style;
  s.setProperty('--gx', (c((e.gamma||0)/30)*fx.tilt*.8).toFixed(2));
  s.setProperty('--gy', (-c(((e.beta||0)-45)/30)*fx.tilt*.8).toFixed(2));
}
let gyBound = false;
function gyroOn(){
  const start = ()=>{ if(!gyBound){ addEventListener('deviceorientation', gy); gyBound = true; } };
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted') start(); else fxSet('gyro',0); }).catch(()=>fxSet('gyro',0));
  } else start();
}
/* scroll parallax for the glass orbs */
addEventListener('scroll', ()=>{ if(fx.par) document.getElementById('gbg').style.setProperty('--sy', scrollY); }, {passive:true});
fxApply(); if(fx.gyro) gyroOn();

const savedTheme = localStorage.getItem('w20-theme');
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
bindPullToRefresh();
updateLangLabel();
if(window.innerWidth < 700) document.getElementById('q').placeholder = 'Search…';
route();
loadLangs().then(ls=>{
  const l = (ls||[]).find(x=>x.code === state.lang);
  if(!l) return;
  const nm = l.native || l.name || state.lang;
  if(nm === state.langName) return;
  state.langName = nm;
  localStorage.setItem('w20-lang-name', nm);
  updateLangLabel();
  const h = location.hash || '#/';
  if(h === '#/' || h === '#') fillTopStats();
});
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
